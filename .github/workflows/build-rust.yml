name: Build Rust Toolchain

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Rust Toolchain (${{ matrix.distro }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie-slim
            distro: trixie
          - image: debian:bookworm-slim
            distro: bookworm

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build toolchain
        env:
          RUST_TOOLCHAIN_IMAGE: ${{ matrix.image }}
        run: ./release.sh

      - name: Upload toolchain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metacall-rust-toolchain-${{ matrix.distro }}
          path: |
            dist/rust-toolchain-runtime.tar.gz
            dist/rust-toolchain-dev.tar.gz
          retention-days: 7
