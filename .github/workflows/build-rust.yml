name: Build Rust Toolchain

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Rust Toolchain (${{ matrix.distro }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:forky-slim
            distro: forky
          - image: debian:trixie-slim
            distro: trixie
          - image: debian:bookworm-slim
            distro: bookworm
          - image: ubuntu:noble
            distro: noble
          - image: ubuntu:jammy
            distro: jammy

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build toolchain
        env:
          RUST_TOOLCHAIN_IMAGE: ${{ matrix.image }}
        run: ./release.sh
      
      - name: Rename artifacts
        run: |
          mv dist/rust-toolchain-runtime.tar.gz \
            dist/rust-toolchain-runtime-${{ matrix.distro }}-amd64.tar.gz
          mv dist/rust-toolchain-dev.tar.gz \
            dist/rust-toolchain-dev-${{ matrix.distro }}-amd64.tar.gz

      - name: Upload toolchain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metacall-rust-toolchain-${{ matrix.distro }}
          path: |
            dist/rust-toolchain-runtime-${{ matrix.distro }}-amd64.tar.gz
            dist/rust-toolchain-dev-${{ matrix.distro }}-amd64.tar.gz
          retention-days: 7

  release: 
    name: Create Github release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
